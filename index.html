<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Extractor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="eyebrow">Local tool</p>
        <h1>Skill Extractor</h1>
        <p class="lede">
          Paste skills mixed with random numbers and signs. Get a clean,
          copyable list with the junk stripped out.
        </p>
      </header>

      <main class="layout">
        <section class="panel">
          <div class="panel-head">
            <h2>Input</h2>
            <span id="input-count" class="meta">0 lines</span>
          </div>
          <textarea
            id="input"
            spellcheck="false"
            placeholder="Paste skills here, one per line or mixed together.&#10;&#10;Examples:&#10;python-programming-847291&#10;React Hooks #392 !!!&#10;• leadership_skill_44&#10;C++ / Docker 12345"
          ></textarea>
          <div class="row">
            <label class="check">
              <input type="checkbox" id="opt-numbers" checked />
              Strip numbers
            </label>
            <label class="check">
              <input type="checkbox" id="opt-signs" checked />
              Strip random signs
            </label>
            <label class="check">
              <input type="checkbox" id="opt-dedupe" checked />
              Remove duplicates
            </label>
            <label class="check">
              <input type="checkbox" id="opt-sort" />
              Sort A–Z
            </label>
          </div>
          <div class="actions">
            <button id="extract" class="primary" type="button">Extract skills</button>
            <button id="clear" type="button">Clear</button>
            <button id="sample" class="ghost" type="button">Load sample</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Clean skills</h2>
            <span id="output-count" class="meta">0 skills</span>
          </div>
          <textarea
            id="output"
            readonly
            placeholder="Clean skills will appear here, one per line."
          ></textarea>
          <div class="actions">
            <button id="copy" class="primary" type="button" disabled>Copy all</button>
            <button id="copy-comma" type="button" disabled>Copy comma-separated</button>
          </div>
          <p id="status" class="status" role="status"></p>
          <ul id="chips" class="chips" aria-label="Extracted skills"></ul>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
